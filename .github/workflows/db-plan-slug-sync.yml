name: DB plan slug sync (additive, one-shot)

# ─────────────────────────────────────────────────────────────────────────────
# PLAN SLUG SYNC MIGRATION — ADDITIVE ONLY.
#
# RUN THIS BEFORE THE CORRESPONDING CODE DEPLOY. The plan editor's rename path
# (syncPlanSlug in server/stripe/planProvisioning.ts) rewrites every referring
# app_users.stripePlanId in one pass, and the account layer writes
# app_users.planPriceId on checkout. If the column is missing in production the
# write fails; if the indexes are missing the rewrite is a full table scan.
#
# WHY app_users.stripePlanId NEEDS AN INDEX AT ALL: it is an FK-BY-VALUE into
# subscription_plans.slug — the entitlement key, read on every access check and
# rewritten in bulk by a plan rename — and it has been unindexed since it was
# introduced. Every one of those lookups scans app_users today.
#
# WHY planPriceId AND NOT AN INTERVAL STRING: 'month' is ambiguous across plans
# and across repricings. plan_prices rows are immutable by convention (repricing
# mints a NEW row and archives the old one), so the id pins the exact price the
# user is still being billed at.
#
# WHY NOT db-push.yml: production TiDB has drifted from the repo, and
# `drizzle-kit generate` diffs against drizzle's META SNAPSHOTS, which do not
# describe the live database, so it emits colliding CREATE TABLEs. This workflow
# follows the db-plan-features.yml precedent: a FIXED (not free-text) set of
# idempotent statements, applied directly.
#
# WHAT IT DOES — all additive:
#   1. ADD COLUMN (guarded) app_users.planPriceId int NULL
#   2. CREATE (guarded)     app_users_plan_price_idx     (planPriceId)
#   3. CREATE (guarded)     app_users_stripe_plan_id_idx (stripePlanId)
#
# WHAT IT NEVER DOES: no DROP, no destructive ALTER, no UPDATE/DELETE/INSERT of
# row data, no user-supplied SQL (so it is not an injection surface — same
# posture as the read-only db-query.yml). In particular it does NOT repair the
# stale slugs themselves (dime-pro-copy → dime-sharp): that is a data write that
# must move subscription_plans.slug and every app_users referrer together, and it
# belongs to the application's syncPlanSlug, which reports the referrer count.
#
# IDEMPOTENCE: MySQL 8 / TiDB accept neither `ADD COLUMN IF NOT EXISTS` nor
# `CREATE INDEX IF NOT EXISTS` on all versions, so the column and both indexes
# are guarded by a SELECT against information_schema and created only when
# absent — re-running is safe and reports SKIP.
#
# NEITHER INDEX IS UNIQUE, DELIBERATELY: many users share one plan slug, and many
# share one price id. A unique index here would reject the second subscriber.
#
# DELIBERATELY OUT OF SCOPE (each needs its own owner-authorized migration):
#   - Backfilling planPriceId for existing subscribers: that is a data write
#     requiring a Stripe subscription→price reconciliation, not DDL.
#   - Any foreign key to plan_prices.id or subscription_plans.slug: this repo
#     declares NO DB-level foreign keys; both are FK-by-value joined in the app.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SLUGSYNC to apply'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db-plan-slug-sync
  cancel-in-progress: false

jobs:
  plan-slug-sync:
    name: Apply additive app_users plan-slug DDL
    runs-on: ubuntu-latest
    # Required by scripts/check-github-actions-security.mjs: any workflow that
    # references a production secret must run inside the protected Production
    # environment, so applying DDL to the live database goes through the same
    # approval gate as db-push.yml.
    environment: Production
    steps:
      - name: Guard — require typed confirmation
        if: ${{ inputs.confirm != 'SLUGSYNC' }}
        run: |
          echo "::error::Type SLUGSYNC in the confirm input to apply."
          exit 1

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Build client config from DATABASE_URL (secret never printed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, stat
          u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          if not u.hostname:
              raise SystemExit("DATABASE_URL is not a valid mysql:// URL")
          db = (u.path or "/").lstrip("/")
          if not db:
              raise SystemExit("DATABASE_URL has no database name in its path")
          cnf = (
              "[client]\n"
              f"host={u.hostname}\n"
              f"port={u.port or 4000}\n"
              f"user={urllib.parse.unquote(u.username or '')}\n"
              f"password={urllib.parse.unquote(u.password or '')}\n"
              f"database={db}\n"
              # TiDB Serverless mandates TLS.
              "ssl-mode=REQUIRED\n"
          )
          with open("client.cnf", "w") as f:
              f.write(cnf)
          os.chmod("client.cnf", stat.S_IRUSR | stat.S_IWUSR)  # 600
          print(f"client.cnf written: host={u.hostname} port={u.port or 4000} db={db} (password omitted)")
          PY

      - name: BEFORE — current state of the targets
        run: |
          set -euo pipefail
          echo "===== BEFORE: does app_users.planPriceId exist? ====="
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT column_name, column_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = DATABASE() AND table_name = 'app_users'
              AND column_name IN ('planPriceId','stripePlanId')
            ORDER BY column_name;"

          echo "===== BEFORE: which of the 2 indexes already exist ====="
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT table_name, index_name, non_unique FROM information_schema.STATISTICS
            WHERE table_schema = DATABASE() AND index_name IN (
              'app_users_plan_price_idx',
              'app_users_stripe_plan_id_idx')
            ORDER BY table_name, index_name;"

          echo "===== BEFORE: plan slugs and their app_users referrer counts ====="
          # Read-only. Shows the stale-slug hazard this migration's code half
          # repairs: a plan whose slug no longer matches its name, with N users
          # still holding the old value in stripePlanId.
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT p.id, p.name, p.slug,
                   (SELECT COUNT(*) FROM app_users u WHERE u.stripePlanId = p.slug) AS referrers
            FROM subscription_plans p
            ORDER BY p.id;"

          echo "===== BEFORE: orphaned stripePlanId values (no matching plan) ====="
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT u.stripePlanId, COUNT(*) AS users
            FROM app_users u
            WHERE u.stripePlanId IS NOT NULL
              AND u.stripePlanId NOT IN (SELECT slug FROM subscription_plans)
            GROUP BY u.stripePlanId
            ORDER BY users DESC;"

      - name: Add app_users.planPriceId (guarded)
        run: |
          set -euo pipefail

          q() { mysql --defaults-extra-file=client.cnf -N -e "$1"; }

          column_exists() {
            q "SELECT COUNT(*) FROM information_schema.columns
                WHERE table_schema = DATABASE()
                  AND table_name = '$1' AND column_name = '$2';"
          }

          echo "===== APPLY: app_users.planPriceId (which billing interval a user is on) ====="
          if [ "$(column_exists app_users planPriceId)" -gt 0 ]; then
            echo "SKIP  app_users.planPriceId already exists"
          else
            echo "ADD   app_users.planPriceId int NULL"
            # NULL-able with no default: every existing row means "unknown",
            # which is exactly true — nothing is backfilled here.
            mysql --defaults-extra-file=client.cnf -e "
              ALTER TABLE app_users ADD COLUMN planPriceId int NULL;"
          fi

      - name: Create indexes (guarded — existence pre-check)
        run: |
          set -euo pipefail

          q() { mysql --defaults-extra-file=client.cnf -N -e "$1"; }

          index_exists() {
            q "SELECT COUNT(*) FROM information_schema.STATISTICS
                WHERE table_schema = DATABASE()
                  AND table_name = '$1' AND index_name = '$2';"
          }

          echo "===== APPLY: app_users interval lookup index ====="
          if [ "$(index_exists app_users app_users_plan_price_idx)" -gt 0 ]; then
            echo "SKIP  app_users.app_users_plan_price_idx already exists"
          else
            echo "CREATE app_users.app_users_plan_price_idx ON (planPriceId)"
            mysql --defaults-extra-file=client.cnf -e "
              CREATE INDEX app_users_plan_price_idx ON app_users (planPriceId);"
          fi

          echo "===== APPLY: app_users entitlement-key index ====="
          if [ "$(index_exists app_users app_users_stripe_plan_id_idx)" -gt 0 ]; then
            echo "SKIP  app_users.app_users_stripe_plan_id_idx already exists"
          else
            echo "CREATE app_users.app_users_stripe_plan_id_idx ON (stripePlanId)"
            mysql --defaults-extra-file=client.cnf -e "
              CREATE INDEX app_users_stripe_plan_id_idx ON app_users (stripePlanId);"
          fi

      - name: AFTER — verify everything landed
        run: |
          set -euo pipefail

          echo "===== AFTER: columns ====="
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT column_name, column_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = DATABASE() AND table_name = 'app_users'
              AND column_name IN ('planPriceId','stripePlanId')
            ORDER BY column_name;"

          echo "===== AFTER: indexes ====="
          mysql --defaults-extra-file=client.cnf -t -e "
            SELECT table_name, index_name, seq_in_index, column_name, non_unique
            FROM information_schema.STATISTICS
            WHERE table_schema = DATABASE() AND index_name IN (
              'app_users_plan_price_idx',
              'app_users_stripe_plan_id_idx')
            ORDER BY index_name, seq_in_index;"

          COL=$(mysql --defaults-extra-file=client.cnf -N -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema = DATABASE() AND table_name = 'app_users'
              AND column_name = 'planPriceId';")
          NULLABLE=$(mysql --defaults-extra-file=client.cnf -N -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema = DATABASE() AND table_name = 'app_users'
              AND column_name = 'planPriceId' AND is_nullable = 'YES';")
          # Count DISTINCT index names: a composite index has one row per column.
          IDX=$(mysql --defaults-extra-file=client.cnf -N -e "
            SELECT COUNT(DISTINCT index_name) FROM information_schema.STATISTICS
            WHERE table_schema = DATABASE() AND table_name = 'app_users'
              AND index_name IN (
                'app_users_plan_price_idx',
                'app_users_stripe_plan_id_idx');")

          echo "column: $COL / 1   nullable: $NULLABLE / 1   indexes: $IDX / 2"
          if [ "$COL" -lt 1 ] || [ "$NULLABLE" -lt 1 ] || [ "$IDX" -lt 2 ]; then
            echo "::error::plan slug sync migration incomplete — column=$COL/1 nullable=$NULLABLE/1 indexes=$IDX/2."
            exit 1
          fi
          echo "app_users ready — safe to deploy the corresponding code."

      - name: Cleanup
        if: always()
        run: rm -f client.cnf
