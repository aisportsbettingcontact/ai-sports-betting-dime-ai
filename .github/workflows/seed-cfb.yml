name: Seed CFB 2026 (populate cfb_* tables)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate seed files without writing to the database"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed-cfb:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Version comes from package.json's "packageManager" field — specifying
      # it here too makes pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Seed CFB 2026 data
        run: pnpm exec tsx scripts/seedCfb2026.mts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
