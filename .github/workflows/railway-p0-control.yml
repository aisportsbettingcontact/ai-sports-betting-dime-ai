name: Railway Production Health

# Secretless production availability probe. Authenticated Railway inspection is
# performed locally through the pinned, read-only dime-railway-keychain broker.
# GitHub Actions deliberately receives no Railway credential and exposes no
# deploy, variable, job, shell, database, or source-mutation operation.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Pinned production health target"
        required: true
        default: all
        type: choice
        options:
          - all
          - application
          - backend

permissions:
  contents: read

concurrency:
  group: railway-production-health
  cancel-in-progress: false

jobs:
  health:
    name: Pinned production health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe pinned HTTPS endpoints
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          probe() {
            label="$1"
            url="$2"
            code="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 20 \
                --proto '=https' \
                --tlsv1.2 \
                "$url"
            )"
            echo "$label: HTTP $code"
            test "$code" -ge 200 -a "$code" -lt 400
          }

          case "$TARGET" in
            all)
              probe application "https://aisportsbettingmodels.com/health"
              probe backend "https://ai-sports-betting-backend-production.up.railway.app/health"
              ;;
            application)
              probe application "https://aisportsbettingmodels.com/health"
              ;;
            backend)
              probe backend "https://ai-sports-betting-backend-production.up.railway.app/health"
              ;;
            *)
              echo "::error::unrecognized pinned target"
              exit 2
              ;;
          esac
