name: DB payment events ledger (additive, one-shot)

# ─────────────────────────────────────────────────────────────────────────────
# CHECKOUT LEDGER MIGRATION — ADDITIVE ONLY. RUN BEFORE THE CODE DEPLOY.
#
# Creates payment_events. The application writes a row on EVERY checkout
# before redirecting the buyer to Stripe, so if the table is missing when the
# code ships, every checkout logs a ledger failure. (It will not break the
# money path — recordCheckoutCreated swallows its own errors by design — but
# the integration ships blind, which is the exact condition being fixed.)
#
# WHY THIS TABLE EXISTS: a checkout previously lived only inside Stripe. The
# only local trace was app_users.pendingStripeSessionId, written solely for
# logged-in buyers, so an anonymous purchase left nothing behind and an
# abandoned one left nothing at all. Two live payments were taken and granted
# nothing; the webhook logged a bail and the event ledger recorded
# status='processed' either way, making a dropped payment indistinguishable
# from a fulfilled one. `fulfillment` is stored separately from `status` so
# "Stripe took the money" and "we granted access" can never collapse again.
#
# WHY NOT db-push.yml: production TiDB has drifted from the repo and
# `drizzle-kit generate` diffs against drizzle's META SNAPSHOTS, which do not
# describe the live database, so it emits colliding CREATE TABLEs. This follows
# the db-plan-slug-sync.yml precedent: a FIXED (not free-text) set of idempotent
# statements applied directly.
#
# WHAT IT DOES — all additive:
#   1. CREATE TABLE IF NOT EXISTS checkout_sessions
#   2. CREATE (guarded) six indexes
#
# WHAT IT NEVER DOES: no DROP, no destructive ALTER, no UPDATE/DELETE of row
# data, no user-supplied SQL (not an injection surface).
#
# IDEMPOTENCE: MySQL 8 / TiDB do not accept `CREATE INDEX IF NOT EXISTS` on all
# versions, so each index is guarded by a SELECT against information_schema and
# created only when absent — re-running is safe and reports SKIP.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PAYMENTLEDGER to apply'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db-payment-events
  cancel-in-progress: false

jobs:
  payment-events:
    name: Create payment_events ledger
    runs-on: ubuntu-latest
    # Required by scripts/check-github-actions-security.mjs: any workflow that
    # references a production secret must run inside the protected Production
    # environment.
    environment: Production
    steps:
      - name: Guard — require typed confirmation
        if: ${{ inputs.confirm != 'PAYMENTLEDGER' }}
        run: |
          echo "::error::Type PAYMENTLEDGER in the confirm input to apply."
          exit 1

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Build client config from DATABASE_URL (secret never printed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, stat
          u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          if not u.hostname:
              raise SystemExit("DATABASE_URL is not a valid mysql:// URL")
          db = (u.path or "/").lstrip("/")
          if not db:
              raise SystemExit("DATABASE_URL has no database name in its path")
          cnf = (
              "[client]\n"
              f"host={u.hostname}\n"
              f"port={u.port or 4000}\n"
              f"user={urllib.parse.unquote(u.username or '')}\n"
              f"password={urllib.parse.unquote(u.password or '')}\n"
              f"database={db}\n"
              # TiDB Serverless mandates TLS.
              "ssl-mode=REQUIRED\n"
          )
          with open("client.cnf", "w") as f:
              f.write(cnf)
          os.chmod("client.cnf", stat.S_IRUSR | stat.S_IWUSR)  # 600
          print(f"client.cnf written: host={u.hostname} port={u.port or 4000} db={db} (password omitted)")
          PY

      - name: Apply payment_events DDL (idempotent)
        run: |
          set -euo pipefail
          mysql --defaults-extra-file=client.cnf -e "
          CREATE TABLE IF NOT EXISTS \`payment_events\` (
            \`id\` int AUTO_INCREMENT NOT NULL,
            \`stripeEventId\` varchar(255) NOT NULL,
            \`eventType\` varchar(64) NOT NULL,
            \`livemode\` tinyint(1) NOT NULL DEFAULT 1,
            \`objectId\` varchar(64) NOT NULL,
            \`objectType\` varchar(32) NOT NULL,
            \`kind\` varchar(24) NOT NULL,
            \`outcome\` varchar(16) NOT NULL DEFAULT 'recorded',
            \`outcomeReason\` varchar(160),
            \`amountCents\` int,
            \`currency\` varchar(8),
            \`amountRefundedCents\` int,
            \`userId\` int,
            \`stripeCustomerId\` varchar(64),
            \`stripeSubscriptionId\` varchar(64),
            \`stripeInvoiceId\` varchar(64),
            \`customerEmail\` varchar(255),
            \`failureCode\` varchar(64),
            \`failureMessage\` varchar(255),
            \`attemptCount\` int,
            \`occurredAt\` bigint NOT NULL,
            \`recordedAt\` bigint NOT NULL,
            CONSTRAINT \`payment_events_id\` PRIMARY KEY(\`id\`),
            CONSTRAINT \`payment_events_event_object_unique\` UNIQUE(\`stripeEventId\`,\`objectId\`)
          );"
          echo "[STEP] table ensured"

          for spec in \
            "payment_events_kind_occurred_idx:\`kind\`,\`occurredAt\`" \
            "payment_events_user_idx:\`userId\`,\`occurredAt\`" \
            "payment_events_customer_idx:\`stripeCustomerId\`" \
            "payment_events_subscription_idx:\`stripeSubscriptionId\`" \
            "payment_events_invoice_idx:\`stripeInvoiceId\`" \
            "payment_events_outcome_idx:\`outcome\`,\`kind\`" ; do
            name="${spec%%:*}"; cols="${spec#*:}"
            exists=$(mysql --defaults-extra-file=client.cnf -N -B -e \
              "SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='payment_events' AND INDEX_NAME='${name}';")
            if [ "$exists" = "0" ]; then
              mysql --defaults-extra-file=client.cnf -e "CREATE INDEX \`${name}\` ON \`payment_events\` (${cols});"
              echo "[STEP] created ${name}"
            else
              echo "[STEP] SKIP ${name} (already present)"
            fi
          done

      - name: Verify — table and every index present
        run: |
          set -euo pipefail
          mysql --defaults-extra-file=client.cnf -e "SHOW COLUMNS FROM \`payment_events\`;"
          missing=$(mysql --defaults-extra-file=client.cnf -N -B -e "
            SELECT 6 - COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS
            WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='payment_events'
              AND INDEX_NAME IN ('payment_events_kind_occurred_idx','payment_events_user_idx',
                                 'payment_events_customer_idx','payment_events_subscription_idx',
                                 'payment_events_invoice_idx','payment_events_outcome_idx');")
          if [ "$missing" != "0" ]; then
            echo "::error::${missing} expected index(es) missing after apply"; exit 1
          fi
          echo "[VERIFY] PASS — payment_events present with all 6 indexes"

      - name: Remove client config
        if: always()
        run: rm -f client.cnf
