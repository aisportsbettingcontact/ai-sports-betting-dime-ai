name: DB subscription events ledger (additive, one-shot)

# ─────────────────────────────────────────────────────────────────────────────
# SUBSCRIPTION LEDGER MIGRATION — ADDITIVE ONLY. RUN BEFORE THE CODE DEPLOY.
#
# Creates subscription_events and flips the app_users.hasAccess DEFAULT to 0.
#
# WHY THIS TABLE EXISTS (avenues #3/#4/#8): plan changes route through the
# Stripe Customer Portal, so no in-app code runs when a member switches plans.
# The only local trace of ANY lifecycle transition was whatever grantUserAccess
# overwrote on app_users — current state, not history. This table records
# from→to plan/price/interval, cancel scheduling, status moves, deletions and
# renewals, with `kind` (what happened) separate from `outcome` (what we did)
# — the same rule that governs checkout_sessions and payment_events.
#
# WHY THE DEFAULT FLIP RIDES ALONG: app_users.hasAccess DEFAULT '1' plus
# expiryDate NULL (= lifetime) meant any INSERT that omitted the column granted
# a silent lifetime membership. Both live insert paths set it explicitly, so
# the flip changes no existing row and no existing behaviour — it makes an
# unwired FUTURE insert path fail closed. Metadata-only ALTER; instant on TiDB.
#
# The application writes subscription_events on every subscription webhook and
# on the in-app cancel/reactivate mutations. If the table is missing when the
# code ships, nothing breaks — recordSubscriptionEvent swallows its own errors
# by design — but the integration ships blind, and SchemaGuard will say so at
# boot. That is the exact miss that happened on BOTH prior ledger deploys:
# RUN THIS BEFORE MERGING.
#
# WHY NOT db-push.yml: production TiDB has drifted from the repo and
# `drizzle-kit generate` diffs against drizzle's META SNAPSHOTS, which do not
# describe the live database, so it emits colliding CREATE TABLEs. This follows
# the db-payment-events.yml precedent: a FIXED (not free-text) set of
# idempotent statements applied directly.
#
# WHAT IT DOES — all additive:
#   1. CREATE TABLE IF NOT EXISTS subscription_events
#   2. CREATE (guarded) five indexes
#   3. ALTER app_users.hasAccess DEFAULT 1 → 0 (guarded, metadata-only)
#
# WHAT IT NEVER DOES: no DROP, no destructive ALTER, no UPDATE/DELETE of row
# data, no user-supplied SQL (not an injection surface).
#
# IDEMPOTENCE: each index and the default flip are guarded by a SELECT against
# information_schema and applied only when needed — re-running is safe and
# reports SKIP.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBLEDGER to apply'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db-subscription-events
  cancel-in-progress: false

jobs:
  subscription-events:
    name: Create subscription_events ledger + fail-closed hasAccess default
    runs-on: ubuntu-latest
    # Required by scripts/check-github-actions-security.mjs: any workflow that
    # references a production secret must run inside the protected Production
    # environment.
    environment: Production
    steps:
      - name: Guard — require typed confirmation
        if: ${{ inputs.confirm != 'SUBLEDGER' }}
        run: |
          echo "::error::Type SUBLEDGER in the confirm input to apply."
          exit 1

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Build client config from DATABASE_URL (secret never printed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, stat
          u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          if not u.hostname:
              raise SystemExit("DATABASE_URL is not a valid mysql:// URL")
          db = (u.path or "/").lstrip("/")
          if not db:
              raise SystemExit("DATABASE_URL has no database name in its path")
          cnf = (
              "[client]\n"
              f"host={u.hostname}\n"
              f"port={u.port or 4000}\n"
              f"user={urllib.parse.unquote(u.username or '')}\n"
              f"password={urllib.parse.unquote(u.password or '')}\n"
              f"database={db}\n"
              # TiDB Serverless mandates TLS.
              "ssl-mode=REQUIRED\n"
          )
          with open("client.cnf", "w") as f:
              f.write(cnf)
          os.chmod("client.cnf", stat.S_IRUSR | stat.S_IWUSR)  # 600
          print(f"client.cnf written: host={u.hostname} port={u.port or 4000} db={db} (password omitted)")
          PY

      - name: Apply subscription_events DDL (idempotent)
        run: |
          set -euo pipefail
          mysql --defaults-extra-file=client.cnf -e "
          CREATE TABLE IF NOT EXISTS \`subscription_events\` (
            \`id\` int AUTO_INCREMENT NOT NULL,
            \`stripeEventId\` varchar(255),
            \`eventType\` varchar(64) NOT NULL,
            \`livemode\` tinyint(1) NOT NULL DEFAULT 1,
            \`stripeSubscriptionId\` varchar(64) NOT NULL,
            \`stripeCustomerId\` varchar(64),
            \`userId\` int,
            \`kind\` varchar(24) NOT NULL,
            \`outcome\` varchar(16) NOT NULL DEFAULT 'recorded',
            \`outcomeReason\` varchar(160),
            \`fromPlanId\` varchar(64),
            \`toPlanId\` varchar(64),
            \`fromPriceId\` varchar(64),
            \`toPriceId\` varchar(64),
            \`fromInterval\` varchar(16),
            \`toInterval\` varchar(16),
            \`status\` varchar(24),
            \`cancelAtPeriodEnd\` tinyint(1),
            \`periodEnd\` bigint,
            \`actor\` varchar(16) NOT NULL DEFAULT 'webhook',
            \`occurredAt\` bigint NOT NULL,
            \`recordedAt\` bigint NOT NULL,
            CONSTRAINT \`subscription_events_id\` PRIMARY KEY(\`id\`),
            CONSTRAINT \`subscription_events_event_kind_unique\` UNIQUE(\`stripeEventId\`,\`kind\`)
          );"
          echo "[STEP] table ensured"

          for spec in \
            "subscription_events_sub_occurred_idx:\`stripeSubscriptionId\`,\`occurredAt\`" \
            "subscription_events_user_occurred_idx:\`userId\`,\`occurredAt\`" \
            "subscription_events_kind_occurred_idx:\`kind\`,\`occurredAt\`" \
            "subscription_events_customer_idx:\`stripeCustomerId\`" \
            "subscription_events_outcome_kind_idx:\`outcome\`,\`kind\`" ; do
            name="${spec%%:*}"; cols="${spec#*:}"
            exists=$(mysql --defaults-extra-file=client.cnf -N -B -e \
              "SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='subscription_events' AND INDEX_NAME='${name}';")
            if [ "$exists" = "0" ]; then
              mysql --defaults-extra-file=client.cnf -e "CREATE INDEX \`${name}\` ON \`subscription_events\` (${cols});"
              echo "[STEP] created ${name}"
            else
              echo "[STEP] SKIP ${name} (already present)"
            fi
          done

      - name: Apply fail-closed hasAccess default (guarded, metadata-only)
        run: |
          set -euo pipefail
          current=$(mysql --defaults-extra-file=client.cnf -N -B -e \
            "SELECT COLUMN_DEFAULT FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='app_users' AND COLUMN_NAME='hasAccess';")
          echo "[STATE] app_users.hasAccess current default: '${current}'"
          if [ "$current" = "0" ]; then
            echo "[STEP] SKIP — default already 0 (fail closed)"
          else
            mysql --defaults-extra-file=client.cnf -e \
              "ALTER TABLE \`app_users\` ALTER COLUMN \`hasAccess\` SET DEFAULT 0;"
            echo "[STEP] default flipped to 0"
          fi

      - name: Verify — table, every index, and the default
        run: |
          set -euo pipefail
          mysql --defaults-extra-file=client.cnf -e "SHOW COLUMNS FROM \`subscription_events\`;"
          missing=$(mysql --defaults-extra-file=client.cnf -N -B -e "
            SELECT 5 - COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS
            WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='subscription_events'
              AND INDEX_NAME IN ('subscription_events_sub_occurred_idx','subscription_events_user_occurred_idx',
                                 'subscription_events_kind_occurred_idx','subscription_events_customer_idx',
                                 'subscription_events_outcome_kind_idx');")
          if [ "$missing" != "0" ]; then
            echo "::error::${missing} expected index(es) missing after apply"; exit 1
          fi
          dflt=$(mysql --defaults-extra-file=client.cnf -N -B -e \
            "SELECT COLUMN_DEFAULT FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='app_users' AND COLUMN_NAME='hasAccess';")
          if [ "$dflt" != "0" ]; then
            echo "::error::app_users.hasAccess default is '${dflt}', expected '0'"; exit 1
          fi
          echo "[VERIFY] PASS — subscription_events present with all 5 indexes; hasAccess fails closed"

      - name: Remove client config
        if: always()
        run: rm -f client.cnf
