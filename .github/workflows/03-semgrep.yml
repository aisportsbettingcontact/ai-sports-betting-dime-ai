# 03-semgrep — repo-specific rules (.semgrep/) written for this codebase's
# architecture. Two jobs: the blocking job runs ONLY the high-confidence
# custom ERROR rules; the advisory job runs registry packs + WARNING rules.
# --error promotes findings to a non-zero exit; scan errors are never
# swallowed (semgrep exits non-zero on internal errors by default; we do not
# pass --no-suppress-errors's inverse anywhere).
name: 03-semgrep

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  SEMGREP_VERSION: "1.172.0" # pinned; bump deliberately

jobs:
  blocking:
    name: 03-semgrep-blocking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: "[GATE] Custom ERROR-severity rules (org policy: hard block)"
        run: semgrep scan --config .semgrep/ server client/src shared scripts --severity ERROR --error --strict

  advisory:
    name: 03-semgrep-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: "Registry packs + WARNING rules (advisory; calibrate then graduate)"
        run: |
          set +e
          semgrep scan --config .semgrep/ --config p/typescript --config p/python \
            --config p/security-audit server client/src shared scripts --error --strict
          code=$?
          set -e
          # Exit 1 = findings (advisory: warn, pass). Anything else non-zero =
          # the SCAN ITSELF failed — fail closed, never report success.
          if [ "$code" -eq 0 ]; then exit 0
          elif [ "$code" -eq 1 ]; then
            echo "::warning::advisory semgrep findings above — review, do not ignore"; exit 0
          else
            echo "::error::semgrep scan error (exit $code) — failing closed"; exit "$code"
          fi
