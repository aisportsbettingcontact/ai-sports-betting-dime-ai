# Read-only DB verification against the application database.
#
# Manual trigger only (workflow_dispatch). Connects with the DATABASE_URL repo
# secret from a CI runner (which has real egress to TiDB, unlike sandboxed
# agent environments) and runs one of a fixed set of read-only queries — no
# free-text SQL, so this never becomes an injection surface in the Actions
# logs. Reports table counts / row counts only; it never selects data rows
# and never writes. The schema to inspect is derived from the URL's path.
name: DB Query (read-only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to report from the application database"
        required: true
        default: summary
        type: choice
        options:
          - summary        # table count + estimated rows + grand total
          - tables         # full table list
          - exact-counts   # exact SELECT COUNT(*) per table (slower, precise)

permissions:
  contents: read

jobs:
  query:
    name: "Query database (${{ github.event.inputs.mode }})"
    runs-on: ubuntu-latest
    steps:
      - name: "[STEP] Install MySQL client"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: "[STEP] Build client config from DATABASE_URL (secret never printed)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, stat
          u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          if not u.hostname:
              raise SystemExit("DATABASE_URL is not a valid mysql:// URL")
          schema = u.path.lstrip("/").split("?")[0]
          if not schema:
              raise SystemExit("DATABASE_URL has no database path component")
          cnf = (
              "[client]\n"
              f"host={u.hostname}\n"
              f"port={u.port or 4000}\n"
              f"user={urllib.parse.unquote(u.username or '')}\n"
              f"password={urllib.parse.unquote(u.password or '')}\n"
              # TiDB Serverless mandates TLS; REQUIRED encrypts the connection.
              "ssl-mode=REQUIRED\n"
          )
          with open("client.cnf", "w") as f:
              f.write(cnf)
          os.chmod("client.cnf", stat.S_IRUSR | stat.S_IWUSR)  # 600
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DB_SCHEMA={schema}\n")
          print("client.cnf written (host/port/user only shown, password omitted):")
          print(f"  host={u.hostname} port={u.port or 4000} user={urllib.parse.unquote(u.username or '')} schema={schema}")
          PY

      - name: "[STEP] Run query"
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"

          if [ "$MODE" = "summary" ]; then
            echo "===== $DB_SCHEMA: summary ====="
            mysql --defaults-extra-file=client.cnf -t -e "
              SELECT COUNT(*) AS total_tables, SUM(table_rows) AS total_est_rows
              FROM information_schema.tables WHERE table_schema='$DB_SCHEMA';"

          elif [ "$MODE" = "tables" ]; then
            echo "===== $DB_SCHEMA: tables ====="
            mysql --defaults-extra-file=client.cnf -N -e "
              SELECT table_name FROM information_schema.tables
              WHERE table_schema='$DB_SCHEMA' ORDER BY table_name;"

          elif [ "$MODE" = "exact-counts" ]; then
            echo "===== $DB_SCHEMA: exact row counts ====="
            TBLS=$(mysql --defaults-extra-file=client.cnf -N -e "
              SELECT table_name FROM information_schema.tables
              WHERE table_schema='$DB_SCHEMA' AND table_type='BASE TABLE' ORDER BY table_name;")
            for t in $TBLS; do
              n=$(mysql --defaults-extra-file=client.cnf -N -e "SELECT COUNT(*) FROM \`$DB_SCHEMA\`.\`$t\`;")
              printf "  %-48s %s\n" "$t" "$n"
            done
          fi

      - name: "[STEP] Cleanup"
        if: always()
        run: rm -f client.cnf
