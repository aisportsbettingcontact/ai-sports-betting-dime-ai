control_pair_minimums:
  records: 240
  distinct_pairs: 120

control_pair_policy:
  shared_fields:
    - task_type
    - scenario_cluster_id
  difference_axes:
    - evidence_status
    - risk_tier
  required_difference_count: 1
  required_outcome_difference_fields:
    - policy_action
  require_same_split: true
  require_equivalent_normalized_input: true
  require_distinct_normalized_output: true

tool_single_call_minimums:
  get_game_context: 40
  get_current_odds: 40
  get_odds_history: 40
  get_market_splits: 40
  calculate_market_math: 40
  get_bet_tracker_summary: 40
  run_simulation: 40

required_curriculum_labels:
  - skill_ids
  - difficulty
  - interaction_mode
  - scenario_cluster_id
  - evidence_status
  - policy_action
  - risk_tier
  - answer_length

admission:
  schema_valid: true
  exact_tool_validation: true
  numeric_traceability: true
  historical_cutoff_audit: true
  provenance_and_rights_complete: true
  privacy_and_consent_complete: true
  direct_identifier_scan: true
  exact_and_semantic_dedup: true
  grouped_partition_audit: true
  evaluation_contamination_audit: true
  approved_only: true
  critical_two_reviewer_minimum: true
  immutable_manifest_before_training: true

stages:
  - name: foundation_screen_authored
    target: 48
    gpu_required: false
  - name: overfit_diagnostic
    target: 32
    gpu_required: true
  - name: foundation_tranche
    target: 600
    gpu_required: false
  - name: complete_foundation_sft
    target: 2400
    gpu_required: false
  - name: one_epoch_candidate
    target: 2160
    gpu_required: true
