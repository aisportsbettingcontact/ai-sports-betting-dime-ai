run:
  name: dime-sft-rehearsal-v1
  mode: rehearsal
  seed: 1729

model:
  id: meta-llama/Llama-3.1-8B
  revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  trust_remote_code: false
  attention_implementation: sdpa
  chat_template: prompts/llama3_dime_chat_template_v1.jinja
  tool_catalog: tools/tools.v1.json

data:
  train: data/sft/train.sample.jsonl
  validation: data/sft/validation.sample.jsonl
  max_length: 4096
  minimum_assistant_tokens: 8
  reject_overlength: true

quantization:
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: bfloat16
  use_double_quant: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: artifacts/checkpoints/dime-sft-rehearsal-v1
  final_adapter_dir: artifacts/adapters/dime-sft-rehearsal-final
  max_steps: 3
  epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_fraction: 0.03
  scheduler: cosine
  logging_steps: 1
  eval_steps: 1
  save_steps: 1
  save_total_limit: 2
  early_stopping:
    metric: validation_loss
    mode: minimize
    patience_evaluations: 3
    minimum_delta: 0.001
    restore_best_checkpoint: true
  max_grad_norm: 1.0
  optimizer: paged_adamw_8bit
  gradient_checkpointing: true
  bf16: true
  tf32: true
  report_to: tensorboard
