schema_version: dime-foundation-numeric-policy-v1
contract_version: dime-foundation-numeric-policy-v1.0.0
status: proposed
dataset_version: dime-sft-foundation-v1
unresolved_decisions: []
authorization_effect:
  scope: governance_validation_only
  creates_data: false
  approves_data: false
  authorizes_gpu_execution: false
  authorizes_training: false
  authorizes_locked_evaluation: false
  authorizes_publication: false
  authorizes_release: false
  authorizes_serving: false
  authorizes_provider_activation: false
purpose: governance_and_validation_metadata_only
invariants:
  bind_all_assistant_numeric_tokens: true
  allow_unbound_literals: false
  allow_ambiguous_bindings: false
  require_reviewed_assertions: true
  require_exact_assistant_message_index: true
  require_exact_claim_span: true
evidence_classes:
  tool_result:
    implementation_status: implemented
    linked_assistant_tool_call_required: true
    exactly_one_matching_tool_result_required: true
    verified_status: ok
    exact_numeric_leaf_path_required: true
    source_ids_required_for_source_dependent_tools: true
    rejected_statuses:
      - partial
      - stale
      - unauthorized
      - blocked_by_policy
      - not_found
      - error
  user_input:
    implementation_status: proposed
    exact_user_message_index_required: true
    exact_text_span_required: true
    recorded_displayed_value_required: true
    user_supplied_label_required: true
    independent_verification_claim_allowed: false
  policy_constant:
    implementation_status: proposed
    versioned_public_policy_source_id_required: true
    exact_source_sha256_required: true
    exact_json_pointer_required: true
    value_and_unit_required: true
    effective_start_required: true
    effective_end_or_open_ended_required: true
    effective_at_record_as_of_required: true
  deterministic_derivation:
    implementation_status: proposed
    registered_operation_required: true
    exact_bound_input_assertions_required: true
    declared_output_unit_required: true
    independent_recomputation_required: true
    arbitrary_or_unnamed_calculation_allowed: false
tolerances:
  probability: 0.000000001
  percentage_points: 0.000001
  decimal_odds: 0.000000001
  american_odds: 0
  units: 0.000001
  roi: 0.000000001
  count: 0
market_math:
  operations:
    - implied_probability
    - remove_vig
    - market_hold
    - expected_value
    - settled_profit
    - roi
    - probability_clv
  independent_recomputation_required: true
  decimal_precision: 80
  internal_presentation_rounding_allowed: false
  non_finite_values_allowed: false
  boolean_values_are_numbers: false
  american_odds_valid_ranges:
    maximum_negative: -100
    minimum_positive: 100
    integers_only: true
  decimal_odds_exclusive_minimum: 1
  roi_arrays_nonempty: true
  roi_arrays_equal_length: true
  aggregate_roi_positive_stake_required: true
  clv_matching_selections_required: true
  clv_backed_selection_required: true
  recomputation_tolerance: 0.000000001
presentation:
  global_precision_defined: false
  global_rounding_mode_defined: false
  record_or_application_specific: true
